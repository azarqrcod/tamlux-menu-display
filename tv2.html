<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TamLux TV2</title>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:black;
}

.slide{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
opacity:0;
transform:scale(1.03);
transition:
opacity 2s ease-in-out,
transform 10s linear;
will-change:opacity,transform;
}

.active{
opacity:1;
transform:scale(1);
z-index:2;
}

</style>
</head>

<body>

<img id="slideA" class="slide active">
<img id="slideB" class="slide">

<script>

const images = [
"images/menu1.png",
"images/menu2.png",
"images/menu3.png",
"images/menu4.png",
"images/menu5.png",
"images/menu6.png"
];

let current = 5;

const slideA = document.getElementById("slideA");
const slideB = document.getElementById("slideB");

slideA.src = images[current];

let activeSlide = slideA;
let nextSlide = slideB;

function changeSlide(){

current = (current + 1) % images.length;

nextSlide.src = images[current];

nextSlide.classList.add("active");
activeSlide.classList.remove("active");

setTimeout(()=>{

let temp = activeSlide;
activeSlide = nextSlide;
nextSlide = temp;

},2000);

}

setInterval(changeSlide,10000);

</script>

</body>
</html>
